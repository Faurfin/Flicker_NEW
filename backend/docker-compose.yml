version: '3.8'

services:
  # Наша база данных PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: backend_user
      POSTGRES_PASSWORD: backend_password
      POSTGRES_DB: backend_db
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Наш кэш Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Наше FastAPI приложение (пока закомментировано или не используется, но готово к запуску)
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis

volumes:
  postgres_data: